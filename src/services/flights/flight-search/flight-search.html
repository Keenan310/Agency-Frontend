<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keenan Travel Flight Results</title>
</head>
<body>
  <div class="page">
    <div class="flight-results-container">

      <!-- TOP SEARCH SUMMARY BAR -->
      <section id="searchSummary" class="search-summary"></section>

      <!-- AIRLINE PRICE STRIP -->
      <section class="airline-strip">
        <button class="strip-arrow" type="button">‹</button>
        <div id="airlineStrip" class="airline-strip-list"></div>
        <button class="strip-arrow" type="button">›</button>
      </section>

      <!-- SORT BAR -->
      <section id="sortBar" class="sort-bar"></section>

      <div class="layout">
        <!-- LEFT FILTER PANEL -->
        <aside id="filterPanel" class="filter-panel"></aside>

        <!-- FLIGHT RESULTS -->
        <main class="results-area">
          <div id="resultCount" class="result-count"></div>
          <div id="flightResults" class="flight-results"></div>
        </main>
      </div>
    </div>
  </div>
  
  <script src="/src/components/flight-card/flight-card.js"></script>
  <script src="./flight-search.js"></script>

</body>
</html>
