<div id="view-track" class="view">
  <div style="background:var(--surface);min-height:calc(100vh - 66px);padding:80px 32px">
    <div style="max-width:580px;margin:0 auto">
      <div class="sec-label" style="text-align:center">Booking Management</div>
      <div class="sec-title" style="text-align:center;margin-bottom:32px">Track Your Booking</div>
      <div class="card" style="padding:28px;margin-bottom:20px">
        <div class="field mb16"><label>Booking Reference Number</label><input type="text" id="track-ref" placeholder="e.g. KT-2026-84712" style="font-size:16px;padding:13px"></div>
        <div class="field mb20"><label>Email Address</label><input type="email" placeholder="your@email.com"></div>
        <button class="btn-gold w100" style="padding:13px;font-size:15px" onclick="showTrackResult()">Track Booking</button>
      </div>
      <div id="track-result" style="display:none">
        <div class="card" style="padding:28px">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:22px">
            <div style="width:50px;height:50px;border-radius:12px;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">✓</div>
            <div><div style="font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink)">KT-2026-84712</div><span class="badge b-green" style="margin-top:4px;display:inline-flex">Confirmed</span></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:0">
            <div style="display:flex;justify-content:space-between;font-size:13.5px;padding:11px 0;border-bottom:1px solid var(--surface3)"><span style="color:var(--slate)">Service</span><span style="font-weight:600">Emirates EK001 — Economy</span></div>
            <div style="display:flex;justify-content:space-between;font-size:13.5px;padding:11px 0;border-bottom:1px solid var(--surface3)"><span style="color:var(--slate)">Route</span><span style="font-weight:600">DXB → LHR</span></div>
            <div style="display:flex;justify-content:space-between;font-size:13.5px;padding:11px 0"><span style="color:var(--slate)">Departure Date</span><span style="font-weight:600">10 June 2026</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
