<div class="modal-bg" id="m-auth" onclick="if(event.target===this)closeModal('m-auth')">
  <div class="modal am-modal">

    <button class="am-close" type="button" onclick="closeModal('m-auth')" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>

    <div class="am-brand">
      <div class="am-logo">Keenan<span> Travel</span></div>
    </div>

    <div class="am-titles">
      <h2 class="am-title" id="auth-title">Welcome Back</h2>
      <p class="am-subtitle" id="auth-subtitle">Sign in to manage your bookings and travel profile.</p>
    </div>

    <div class="am-tabs" id="auth-mode-tabs">
      <button class="am-tab active" id="auth-mode-login" type="button" onclick="setAuthMode('login')">Sign In</button>
      <button class="am-tab" id="auth-mode-register" type="button" onclick="setAuthMode('register')">Create Account</button>
    </div>

    <div class="am-body">

      <div class="auth-alert" id="auth-alert" style="display:none"></div>

      <div id="auth-social-row">
        <button type="button" class="am-google-btn" onclick="signInWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span id="auth-google-text">Continue with Google</span>
        </button>
      </div>

      <div class="am-divider" id="auth-divider">
        <span>or continue with email</span>
      </div>

      <form id="auth-form" class="am-form" onsubmit="submitAuth(event)" novalidate>

        <div class="field-row" id="auth-register-row" style="display:none">
          <div class="field">
            <label>First Name</label>
            <input type="text" id="auth-first-name" placeholder="Ahmed" autocomplete="given-name">
          </div>
          <div class="field">
            <label>Last Name</label>
            <input type="text" id="auth-last-name" placeholder="Al-Rashidi" autocomplete="family-name">
          </div>
        </div>

        <div class="field" id="auth-username-row" style="display:none">
          <label>Username</label>
          <input type="text" id="auth-username" placeholder="your_username" autocomplete="off" maxlength="30">
          <span class="am-field-hint">3–30 characters · letters, numbers, _ or .</span>
        </div>

        <div class="field" id="auth-email-field">
          <label id="auth-email-label">Email or Username</label>
          <input type="text" id="auth-email" placeholder="your@email.com or username" autocomplete="email">
        </div>

        <div class="field" id="auth-phone-row" style="display:none">
          <label>Mobile Number</label>
          <input type="tel" id="auth-phone" placeholder="+971 50 000 0000" autocomplete="tel">
        </div>

        <div class="field" id="auth-password-row">
          <label>Password</label>
          <div class="am-pw-wrap">
            <input type="password" id="auth-password" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="am-pw-eye" onclick="togglePw('auth-password',this)" tabindex="-1" aria-label="Show password">
              <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-shut" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="am-strength-wrap" id="auth-pw-strength" style="display:none">
            <div class="am-strength-track">
              <div class="am-strength-fill" id="auth-pw-fill"></div>
            </div>
            <span class="am-strength-label" id="auth-pw-label">—</span>
          </div>
        </div>

        <div class="field" id="auth-confirm-row" style="display:none">
          <label>Confirm Password</label>
          <div class="am-pw-wrap">
            <input type="password" id="auth-confirm-password" placeholder="Re-enter your password" autocomplete="new-password">
            <button type="button" class="am-pw-eye" onclick="togglePw('auth-confirm-password',this)" tabindex="-1" aria-label="Show password">
              <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-shut" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div id="auth-forgot-row" style="display:flex;justify-content:flex-end;margin-top:-4px">
          <button type="button" class="am-text-link" onclick="setAuthMode('forgot')">Forgot Password?</button>
        </div>

        <div id="auth-back-row" style="display:none;margin-top:-4px">
          <button type="button" class="am-text-link" onclick="setAuthMode('login')">← Back to Sign In</button>
        </div>

        <button class="am-submit" id="auth-submit" type="submit">Sign In</button>

      </form>

      <div class="am-footer" id="auth-footer">
        <span id="auth-footer-text">Don't have an account?</span>
        <button type="button" class="am-text-link am-text-link--bold" id="auth-footer-link" onclick="setAuthMode('register')">Create one</button>
      </div>

    </div>
  </div>
</div>
