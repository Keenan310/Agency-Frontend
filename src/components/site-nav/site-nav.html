<nav id="site-nav">
  <div class="nav-logo" onclick="go('home')">Keenan<span> Travel</span></div>
  <div class="nav-links">
    <button class="nl act" onclick="go('home')">Home</button>
    <button class="nl" onclick="goSearch('flights')">Flights</button>
    <button class="nl" onclick="goSearch('umrah')">Umrah</button>
    <button class="nl" onclick="goSearch('holiday')">Holidays</button>
    <button class="nl" onclick="goSearch('cruise')">Cruise</button>
    <button class="nl" onclick="goSearch('visa')">Visa Services</button>
    <button class="nl" onclick="go('track')">Track Booking</button>
  </div>
  <div class="nav-right">
    <!-- Consolidated User Menu -->
    <div class="user-menu" id="user-menu-root">
      <!-- Trigger (Avatar for logged in, Person icon for guest) -->
      <div class="user-profile-trigger" id="user-profile-trigger" onclick="toggleUserDropdown()">
        <div class="user-avatar" id="nav-avatar">
          <span id="nav-avatar-initials">?</span>
          <img id="nav-avatar-img" src="" alt="Profile" style="display:none">
        </div>
        <div class="nav-user-meta-brief" id="nav-user-meta-brief">
          <span id="nav-brief-name">Sign In</span>
          <span id="nav-brief-country">🇦🇪 UAE</span>
        </div>
        <svg width="10" height="6" viewBox="0 0 10 6" class="dropdown-arrow"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </div>

      <!-- Dropdown Menu -->
      <div class="user-dropdown" id="user-dropdown">
        <!-- User Info Section (Visible when logged in) -->
        <div id="ud-user-section" style="display:none">
          <div class="ud-header">
            <div class="ud-name" id="nav-user-name">Guest User</div>
            <div class="ud-email" id="nav-user-email">guest@example.com</div>
          </div>
          <div class="ud-divider"></div>
          <button class="ud-item" onclick="openCustomerPortal('profile')">
            <span class="ud-icon">👤</span> My Profile
          </button>
          <button class="ud-item" onclick="openCustomerPortal('account')">
            <span class="ud-icon">💼</span> My Account
          </button>
          <div class="ud-divider"></div>
        </div>

        <!-- Guest Section (Visible when logged out) -->
        <div id="ud-guest-section">
          <button class="ud-item" onclick="openAuthModal('customer')">
            <span class="ud-icon">🔑</span> Sign In / Register
          </button>
          <div class="ud-divider"></div>
        </div>

        <!-- Shared Section: Country Selector -->
        <div class="ud-label">Country & Currency</div>
        <div class="ud-country-options">
          <div class="ud-c-opt" id="ud-c-AE" onclick="switchCountry('AE')">
            <span>🇦🇪 UAE (AED)</span>
            <span class="check">✓</span>
          </div>
          <div class="ud-c-opt" id="ud-c-PK" onclick="switchCountry('PK')">
            <span>🇵🇰 Pakistan (PKR)</span>
            <span class="check" style="display:none">✓</span>
          </div>
        </div>

        <div class="ud-divider"></div>
        <button class="ud-item" onclick="go('track')">
          <span class="ud-icon">🔍</span> Track Booking
        </button>

        <!-- Logout (Visible when logged in) -->
        <div id="ud-logout-section" style="display:none">
          <div class="ud-divider"></div>
          <button class="ud-item logout" onclick="logoutSession()">
            <span class="ud-icon">🚀</span> Sign Out
          </button>
        </div>
      </div>
    </div>
    
  </div>
</nav>
