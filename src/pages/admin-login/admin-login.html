<div class="view" id="view-admin-login">
  <div class="al-page">
    <div class="al-brand">
      <div class="al-logo">Keenan<span> Travel</span></div>
      <div class="al-brand-sub">Administration Portal</div>
    </div>
    <div class="al-card">
      <div class="al-card-header">
        <div class="al-card-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
          </svg>
        </div>
        <div>
          <div class="al-card-title">Admin Sign In</div>
          <div class="al-card-subtitle">Operations &amp; Management Dashboard</div>
        </div>
      </div>
      <div class="al-alert" id="al-alert" style="display:none"></div>
      <form class="al-form" id="al-form" onsubmit="submitAdminLogin(event)">
        <div class="al-field">
          <label class="al-label">Email Address</label>
          <input class="al-input" type="email" id="al-email" placeholder="admin@keenantravel.local" required autocomplete="username">
        </div>
        <div class="al-field">
          <label class="al-label">Password</label>
          <input class="al-input" type="password" id="al-password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button class="al-btn" id="al-submit" type="submit">Sign In to Dashboard</button>
      </form>
      <p class="al-notice">Access is restricted to authorised personnel only. All activity is monitored and logged.</p>
      <div class="al-back">
        <button type="button" class="al-back-link" onclick="go('home')">← Return to Website</button>
      </div>
    </div>
  </div>
</div>
