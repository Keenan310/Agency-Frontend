<div id="view-results-umrah" class="view">
  <div class="results-hero">
    <div class="results-inner">
      <div class="breadcrumb">
        <span onclick="go('home')">Home</span>
        <span>›</span>
        <span>Umrah</span>
      </div>
      <div style="font-family:var(--serif);font-size:28px;font-weight:700;color:var(--white);margin-bottom:6px">Umrah Packages</div>
      <div style="color:rgba(255,255,255,.5);font-size:14px" id="umrah-packages-count">Loading packages...</div>
    </div>
  </div>
  
  <div class="section" style="padding-top: 40px; padding-bottom: 80px;">
    <!-- FILTER BAR -->
    <div style="display: flex; gap: 16px; margin-bottom: 24px; align-items: center; justify-content: flex-end;">
      <select id="umrah-filter-duration" style="padding: 10px 14px; border-radius: 8px; border: 1px solid var(--surface3); background: var(--white); font-family: var(--sans); font-size: 14px; color: var(--ink);">
        <option value="">Any Duration</option>
        <option value="7">7 Days</option>
        <option value="10">10 Days</option>
        <option value="15">15 Days</option>
        <option value="21">21 Days</option>
      </select>
      <select id="umrah-filter-sort" style="padding: 10px 14px; border-radius: 8px; border: 1px solid var(--surface3); background: var(--white); font-family: var(--sans); font-size: 14px; color: var(--ink);">
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
      </select>
    </div>
    
    <div class="grid gauto gap24" id="umrah-results-container">
      <!-- Cards populated here by index.js -->
    </div>
  </div>
</div>
